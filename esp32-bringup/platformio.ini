; ============================================================
;  ESP32 陪伴裝置 — 硬體 bring-up 專案
;  工具鏈：VS Code + PlatformIO IDE extension
;
;  每個 [env:...] 對應交接文件的一個階段。
;  同一份 src/ 用 APP_STAGE 巨集切換，避免大量複製程式碼。
;
;  用法（VS Code 左側 PlatformIO 圖示 → Project Tasks）：
;    s1_serial    → Step 1：只證明電腦與板子能通訊
;    s2_fsr1      → Step 2：單一 FSR 分壓 raw ADC
;    s3_fsr2      → Step 3：雙 FSR，Serial Plotter 曲線
;    s4_imu       → Step 4：I2C scanner / IMU 讀值
;    s5_lcd       → Step 5：LCD 黑貓臉 + 逐字台詞（WiFi WebSocket 收指令）
;    s6_all       → Step 6：整合 telemetry + CSV
;    s7_wifi_http → Step 7：WiFi SoftAP + HTTP hello world（先證明 WiFi 硬體會動）
;    s8_wifi_ws   → Step 8：WiFi SoftAP + WebSocket（FSR/LCD 實際要用的通道）
; ============================================================

[platformio]
default_envs = s1_serial
src_dir = src

; ---------- 所有 env 共用 ----------
[env]
platform = espressif32
framework = arduino

; ⚠ board 目前是「候選值」，不是已確認的辨識結果。
;   使用者描述：賣場料號 XO148-1，ESP32 模組 38p。
;   38-pin 泛用板最常見為 ESP32-WROOM-32 DevKit → board = esp32dev。
;   Stage 1 開機時會印出 ESP.getChipModel()，以那個輸出為準回來修正這一行。
;   若實際是 ESP32-S3 / C3 / C6，這一行要改，且 board_config.h 的 GPIO 全部要重配。
board = esp32dev

monitor_speed = 115200
upload_speed = 921600

; Windows 上 PlatformIO 通常能自動找到 COM port。
; 若你有多個序列裝置（例如藍牙 COM），把下面兩行取消註解並填入實際 port，
; 避免對未知序列裝置操作。
; upload_port = COM3
; monitor_port = COM3

; 讓 ESP32 開機當下的 boot log 也看得到（除錯 brownout / 重啟很有用）
monitor_filters = esp32_exception_decoder, time

build_flags =
    -D MONITOR_SPEED=115200

; ---------- Step 1：最小 Serial ----------
[env:s1_serial]
build_flags =
    ${env.build_flags}
    -D APP_STAGE=1

; ---------- Step 2：單 FSR ----------
[env:s2_fsr1]
build_flags =
    ${env.build_flags}
    -D APP_STAGE=2

; ---------- Step 3：雙 FSR ----------
[env:s3_fsr2]
build_flags =
    ${env.build_flags}
    -D APP_STAGE=3

; ---------- Step 4：MPU6050 I2C scanner + 六軸讀值，顯示在 LCD ----------
[env:s4_imu]
build_flags =
    ${env.build_flags}
    -D APP_STAGE=4
lib_deps =
    adafruit/Adafruit MPU6050
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit BusIO
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit GFX Library

; ---------- Step 5：LCD 黑貓臉（會動的眼睛 + 逐字台詞），指令走 WiFi WebSocket ----------
[env:s5_lcd]
build_flags =
    ${env.build_flags}
    -D APP_STAGE=5
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit GFX Library
    links2004/WebSockets@2.7.2
    bblanchon/ArduinoJson@^7
    olikraus/U8g2_for_Adafruit_GFX

; ---------- Step 6：整合 ----------
[env:s6_all]
build_flags =
    ${env.build_flags}
    -D APP_STAGE=6

; ---------- Step 7：WiFi SoftAP + HTTP hello world ----------
; 只用內建 WebServer.h，不需要額外 library。
; 目的：在加 WebSocket 之前，先證明「WiFi 硬體會動、電腦連得上」。
[env:s7_wifi_http]
build_flags =
    ${env.build_flags}
    -D APP_STAGE=7

; ---------- Step 8：WiFi SoftAP + WebSocket ----------
; FSR 要持續回傳、LCD 指令要持續下發，都是連續雙向的小封包，
; HTTP polling 效率差，改用 WebSocket（一次握手後維持長連線）。
[env:s8_wifi_ws]
build_flags =
    ${env.build_flags}
    -D APP_STAGE=8
lib_deps =
    links2004/WebSockets

; Step 9: real FSR + MPU6050 telemetry, HTTP dashboard + WebSocket
[env:s9_wifi_sensors]
build_flags =
    ${env.build_flags}
    -D APP_STAGE=9
lib_deps =
    links2004/WebSockets@2.7.2
    adafruit/Adafruit MPU6050
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit BusIO

; ---------- Step 10：無源蜂鳴器 MTARDALL112 PWM 測試 ----------
; 用 Arduino tone()/noTone()（arduino-esp32 內建，走 LEDC），不需要額外 lib_deps。
[env:s10_buzzer]
build_flags =
    ${env.build_flags}
    -D APP_STAGE=10

; ---------- Step 11：INMP441 I2S 麥克風測試 ----------
; 用 ESP-IDF 內建的 driver/i2s.h，不需要額外 lib_deps。
[env:s11_mic]
build_flags =
    ${env.build_flags}
    -D APP_STAGE=11

; ---------- Step 12：INMP441 錄音 -> 原始 PCM 用 Serial 倒到電腦存成 .wav ----------
; 跟 s11 同一組接線，不用重接。這個 env 的 Serial 鮑率會在程式裡改成
; MIC_WAV_STREAM_BAUD（921600），開 Serial Monitor 要記得也切到這個速度。
[env:s12_mic_wav]
build_flags =
    ${env.build_flags}
    -D APP_STAGE=12
; 這個階段的韌體把 Serial 切到 921600（見 MIC_WAV_STREAM_BAUD），
; 所以「這個 env」的 Serial Monitor 也要用 921600，不能用上面 [env] 的
; 115200，不然點 Monitor 只會看到亂碼。
monitor_speed = 921600

; ---------- Step 13：整合 build（LCD + FSR/IMU/WS + 蜂鳴器 + 麥克風）----------
; 對應 docs/api.html §① 的 WebSocket 合約，取代原本規劃的 Step 6。
; 還沒有實機驗證過，見 include/companion_app.h 檔頭的警告。
[env:s13_companion]
build_flags =
    ${env.build_flags}
    -D APP_STAGE=13
lib_deps =
    links2004/WebSockets@2.7.2
    adafruit/Adafruit MPU6050
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit BusIO
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit GFX Library
    bblanchon/ArduinoJson@^6.21.5
