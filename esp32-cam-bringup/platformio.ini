; ============================================================
;  ESP32-CAM（OV2640，AI-Thinker 版型）— 獨立 bring-up 專案
;
;  這是跟 esp32-bringup（主板：FSR/IMU/LCD/蜂鳴器/麥克風）分開的
;  獨立 PlatformIO 專案，因為 ESP32-CAM 是第二顆晶片、獨立燒錄、
;  只接相機，不接任何主板上的其他零件。
;
;  假設板型：AI-Thinker ESP32-CAM（市面上「ESP32-CAM-OV2640-Module
;  WiFi藍牙」大多是這款）。若板子絲印跟 include/camera_pins.h 對不起來，
;  先拍照回報，可能是其他廠牌，腳位會不一樣。
; ============================================================
[env:cam_stream]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time
build_flags =
    -D MONITOR_SPEED=115200
